        }

        .card:hover {
            transform: translateY(-5px);
            background: #e6f3ff;
            box-shadow: 0 8px 20px rgba(18, 60, 105, 0.16);
        }

        .card:focus-visible {

            padding: 18px 12px;

            color: white;
            text-align: center;
            font-size: 14px;
        }

        /* Tablet: two cards per row */
        @media (max-width: 900px) {
            .card-container {
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 16px;
            }

            .card {
                min-height: 115px;
                font-size: 18px;
            }
        }

        /* Mobile: compact, vertically stacked cards */
        @media (max-width: 520px) {
            header {
                padding: 24px 14px;
            }

            header p {
                font-size: 14px;
            }

            main {
                padding: 20px 14px;
            }

            .section-title {
                font-size: 21px;
                margin-bottom: 16px;
            }

            .card-container {
                grid-template-columns: 1fr;
                gap: 12px;
            }

            .card {
                min-height: 68px;
                padding: 16px;
                font-size: 17px;
                border-radius: 9px;
            }

            footer {
                margin-top: 16px;
                padding: 16px 10px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .card {
                transition: none;
            }

            .card:hover {
                transform: none;
            }
        }
