<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>English Alphabet Letter Hunt</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f0f7ff;
      margin: 0;
      padding: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    h1 {
      color: #2c3e50;
      margin: 5px 0 10px 0;
      text-align: center;
      font-size: 1.4rem;
    }
    /* Fully responsive letter picker grid optimized for mobile screens */
    .alphabet-grid {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 5px;
      max-width: 600px;
      width: 100%;
      background: #ffffff;
      border: 2.5px solid #90caf9;
      border-radius: 12px;
      padding: 8px;
      margin-bottom: 12px;
      box-shadow: 0 3px 6px rgba(0,0,0,0.05);
    }
    .btn-letter {
      background: #f5f5f5;
      border: 1.5px solid #ddd;
      height: 38px;
      font-size: 1rem;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      color: #424242;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
    }
    .btn-letter:active {
      transform: scale(0.92);
    }
    .btn-letter.active {
      background: #2196f3;
      color: white;
      border-color: #1565c0;
      transform: scale(1.05);
      box-shadow: 0 2px 5px rgba(33, 150, 243, 0.4);
    }
    .instruction {
      font-size: 0.95rem;
      color: #333;
      margin-bottom: 12px;
      background: #e1f5fe;
      border: 2px solid #b3e5fc;
      padding: 6px 15px;
      border-radius: 20px;
      font-weight: bold;
      text-align: center;
      width: 100%;
      max-width: 600px;
    }
    .target-badge {
      display: inline-block;
      background: #ff9800;
      color: white;
      padding: 1px 8px;
      border-radius: 8px;
      font-size: 1.15rem;
    }
    /* Fully responsive game room grid (2 columns on mobile, 3 columns on tablet/desktop) */
    .room-container {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      width: 100%;
      max-width: 600px;
      background: #ffffff;
      border: 3px solid #90caf9;
      border-radius: 16px;
      padding: 15px;
      box-shadow: 0 6px 12px rgba(0,0,0,0.08);
    }
    .item-card {
      background: #fafafa;
      border: 2.5px solid #e0e0e0;
      border-radius: 14px;
      padding: 14px 8px;
      text-align: center;
      cursor: pointer;
      transition: transform 0.15s, border-color 0.15s, background-color 0.15s;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 120px;
    }
    .item-card:active {
      transform: scale(0.96);
    }
    .item-card.correct {
      border-color: #4caf50;
      background-color: #e8f5e9;
      cursor: default;
    }
    .item-card.wrong {
      animation: shake 0.4s;
      border-color: #f44336;
      background-color: #ffebee;
    }
    .item-icon {
      font-size: 3.8rem;
      margin-bottom: 6px;
      line-height: 1;
    }
    .item-label {
      font-size: 1.1rem;
      font-weight: bold;
      color: #424242;
    }
    .status-bar {
      margin-top: 10px;
      font-size: 1rem;
      font-weight: bold;
      color: #2e7d32;
      min-height: 25px;
      text-align: center;
      padding: 0 10px;
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }
    #completion-modal {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.6);
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 20px;
    }
    .modal-content {
      background: white;
      padding: 25px 20px;
      border-radius: 18px;
      text-align: center;
      max-width: 340px;
      width: 100%;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }
    .modal-content h2 {
      margin-top: 0;
      color: #2e7d32;
    }
    .btn-restart {
      background: #4caf50;
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 1.1rem;
      border-radius: 10px;
      cursor: pointer;
      margin-top: 15px;
      font-weight: bold;
      box-shadow: 0 4px 10px rgba(76, 175, 80, 0.3);
    }

    /* Media query adjustments for wider tablets and desktop screens */
    @media (min-width: 650px) {
      .alphabet-grid {
        grid-template-columns: repeat(12, 1fr);
        max-width: 800px;
      }
      .room-container {
        grid-template-columns: repeat(3, 1fr);
        max-width: 800px;
      }
      h1 {
        font-size: 1.6rem;
      }
      .instruction {
        font-size: 1.1rem;
        max-width: 800px;
      }
      .item-icon {
        font-size: 4.8rem;
      }
    }
  </style>
</head>
<body>

  <h1>English Alphabet Game: Letter Hunt</h1>
  
  <div class="alphabet-grid" id="alphabet-grid">
    <!-- Dynamically populated via JS -->
  </div>

  <div class="instruction">
    '<span class="target-badge" id="target-letter">अ</span>' sound. Click on the things that start with the target letter!
  </div>

  <div class="room-container" id="room-container">
    <!-- Items dynamically populated -->
  </div>

  <div class="status-bar" id="status-text"></div>

  <!-- Win Modal -->
  <div id="completion-modal">
    <div class="modal-content">
      <h2>🎉 Great Job!</h2>
      <p id="modal-text">You found all the correct words!</p>
      <button class="btn-restart" onclick="loadLevel(currentTargetLetter)">Play Again</button>
    </div>
  </div>

  <script>
    let audioCtx = null;

    function getAudioContext() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    // Upbeat musical chord progression for correct answers (Arcade style success jingle)
    function playCorrectSound() {
      try {
        const ctx = getAudioContext();
        const now = ctx.currentTime;
        
        const notes = [523.25, 659.25, 783.99, 1046.50];
        notes.forEach((freq, index) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, now + index * 0.08);
          
          gain.gain.setValueAtTime(0.25, now + index * 0.08);
          gain.gain.exponentialRampToValueAtTime(0.001, now + index * 0.08 + 0.35);
          
          osc.connect(gain);
          gain.connect(ctx.destination);
          
          osc.start(now + index * 0.08);
          osc.stop(now + index * 0.08 + 0.35);
        });
      } catch (e) {
        console.log("Audio play error:", e);
      }
    }

    // Soft, friendly bounce-back sound for incorrect answers
    function playWrongSound() {
      try {
        const ctx = getAudioContext();
        const now = ctx.currentTime;
        
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        
        osc.type = 'sine';
        osc.frequency.setValueAtTime(220, now);
        osc.frequency.linearRampToValueAtTime(140, now + 0.2);
        
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
        
        osc.connect(gain);
        gain.connect(ctx.destination);
        
        osc.start(now);
        osc.stop(now + 0.25);
      } catch (e) {
        console.log("Audio play error:", e);
      }
    }

    const alphabetData = {
      "A": { target: [{word: "Apple", icon: "🍎"}, {word: "Ant", icon: "🐜"}, {word: "Airplane", icon: "✈️"}], distractors: [{word: "Ball", icon: "⚽"}, {word: "Cat", icon: "🐱"}, {word: "Dog", icon: "🐶"}] },
      "B": { target: [{word: "Ball", icon: "⚽"}, {word: "Banana", icon: "🍌"}, {word: "Butterfly", icon: "🦋"}], distractors: [{word: "Cat", icon: "🐱"}, {word: "Dog", icon: "🐶"}, {word: "Elephant", icon: "🐘"}] },
      "C": { target: [{word: "Cat", icon: "🐱"}, {word: "Car", icon: "🚗"}, {word: "Cake", icon: "🍰"}], distractors: [{word: "Dog", icon: "🐶"}, {word: "Elephant", icon: "🐘"}, {word: "Fish", icon: "🐟"}] },
      "D": { target: [{word: "Dog", icon: "🐶"}, {word: "Duck", icon: "🦆"}, {word: "Drum", icon: "🥁"}], distractors: [{word: "Elephant", icon: "🐘"}, {word: "Fish", icon: "🐟"}, {word: "Grapes", icon: "🍇"}] },
      "E": { target: [{word: "Elephant", icon: "🐘"}, {word: "Egg", icon: "🥚"}, {word: "Eagle", icon: "🦅"}], distractors: [{word: "Fish", icon: "🐟"}, {word: "Grapes", icon: "🍇"}, {word: "Horse", icon: "🐴"}] },
      "F": { target: [{word: "Fish", icon: "🐟"}, {word: "Flower", icon: "🌸"}, {word: "Frog", icon: "🐸"}], distractors: [{word: "Grapes", icon: "🍇"}, {word: "Horse", icon: "🐴"}, {word: "Ice cream", icon: "🍦"}] },
      "G": { target: [{word: "Grapes", icon: "🍇"}, {word: "Goat", icon: "🐐"}, {word: "Guitar", icon: "🎸"}], distractors: [{word: "Horse", icon: "🐴"}, {word: "Ice cream", icon: "🍦"}, {word: "Juice", icon: "🧃"}] },
      "H": { target: [{word: "Horse", icon: "🐴"}, {word: "House", icon: "🏠"}, {word: "Hat", icon: "🎩"}], distractors: [{word: "Ice cream", icon: "🍦"}, {word: "Juice", icon: "🧃"}, {word: "Kite", icon: "🪁"}] },
      "I": { target: [{word: "Ice cream", icon: "🍦"}, {word: "Igloo", icon: "🛖"}, {word: "Insect", icon: "🐞"}], distractors: [{word: "Juice", icon: "🧃"}, {word: "Kite", icon: "🪁"}, {word: "Lion", icon: "🦁"}] },
      "J": { target: [{word: "Juice", icon: "🧃"}, {word: "Jellyfish", icon: "🪼"}, {word: "Jacket", icon: "🧥"}], distractors: [{word: "Kite", icon: "🪁"}, {word: "Lion", icon: "🦁"}, {word: "Mango", icon: "🥭"}] },
      "K": { target: [{word: "Kite", icon: "🪁"}, {word: "Kangaroo", icon: "🦘"}, {word: "Key", icon: "🔑"}], distractors: [{word: "Lion", icon: "🦁"}, {word: "Mango", icon: "🥭"}, {word: "Nest", icon: "🪺"}] },
      "L": { target: [{word: "Lion", icon: "🦁"}, {word: "Leaf", icon: "🍃"}, {word: "Lamp", icon: "💡"}], distractors: [{word: "Mango", icon: "🥭"}, {word: "Nest", icon: "🪺"}, {word: "Orange", icon: "🍊"}] },
      "M": { target: [{word: "Mango", icon: "🥭"}, {word: "Monkey", icon: "🐒"}, {word: "Moon", icon: "🌙"}], distractors: [{word: "Nest", icon: "🪺"}, {word: "Orange", icon: "🍊"}, {word: "Parrot", icon: "🦜"}] },
      "N": { target: [{word: "Nest", icon: "🪺"}, {word: "Nose", icon: "👃"}, {word: "Nurse", icon: "🧑‍⚕️"}], distractors: [{word: "Orange", icon: "🍊"}, {word: "Parrot", icon: "🦜"}, {word: "Queen", icon: "👑"}] },
      "O": { target: [{word: "Orange", icon: "🍊"}, {word: "Owl", icon: "🦉"}, {word: "Octopus", icon: "🐙"}], distractors: [{word: "Parrot", icon: "🦜"}, {word: "Queen", icon: "👑"}, {word: "Rabbit", icon: "🐇"}] },
      "P": { target: [{word: "Parrot", icon: "🦜"}, {word: "Pencil", icon: "✏️"}, {word: "Pizza", icon: "🍕"}], distractors: [{word: "Queen", icon: "👑"}, {word: "Rabbit", icon: "🐇"}, {word: "Sun", icon: "☀️"}] },
      "Q": { target: [{word: "Queen", icon: "👑"}, {word: "Quilt", icon: "🛏️"}, {word: "Quail", icon: "🐦"}], distractors: [{word: "Rabbit", icon: "🐇"}, {word: "Sun", icon: "☀️"}, {word: "Tiger", icon: "🐯"}] },
      "R": { target: [{word: "Rabbit", icon: "🐇"}, {word: "Rainbow", icon: "🌈"}, {word: "Rocket", icon: "🚀"}], distractors: [{word: "Sun", icon: "☀️"}, {word: "Tiger", icon: "🐯"}, {word: "Umbrella", icon: "☂️"}] },
      "S": { target: [{word: "Sun", icon: "☀️"}, {word: "Star", icon: "⭐"}, {word: "Snake", icon: "🐍"}], distractors: [{word: "Tiger", icon: "🐯"}, {word: "Umbrella", icon: "☂️"}, {word: "Van", icon: "🚐"}] },
      "T": { target: [{word: "Tiger", icon: "🐯"}, {word: "Tree", icon: "🌳"}, {word: "Train", icon: "🚂"}], distractors: [{word: "Umbrella", icon: "☂️"}, {word: "Van", icon: "🚐"}, {word: "Whale", icon: "🐋"}] },
      "U": { target: [{word: "Umbrella", icon: "☂️"}, {word: "Unicorn", icon: "🦄"}, {word: "Uniform", icon: "🥋"}], distractors: [{word: "Van", icon: "🚐"}, {word: "Whale", icon: "🐋"}, {word: "Xylophone", icon: "🎹"}] },
      "V": { target: [{word: "Van", icon: "🚐"}, {word: "Violin", icon: "🎻"}, {word: "Volcano", icon: "🌋"}], distractors: [{word: "Whale", icon: "🐋"}, {word: "Xylophone", icon: "🎹"}, {word: "Yo-yo", icon: "🪀"}] },
      "W": { target: [{word: "Whale", icon: "🐋"}, {word: "Watch", icon: "⌚"}, {word: "Watermelon", icon: "🍉"}], distractors: [{word: "Xylophone", icon: "🎹"}, {word: "Yo-yo", icon: "🪀"}, {word: "Zebra", icon: "🦓"}] },
      "X": { target: [{word: "Xylophone", icon: "🎹"}, {word: "X-ray", icon: "🩻"}], distractors: [{word: "Yo-yo", icon: "🪀"}, {word: "Zebra", icon: "🦓"}, {word: "Apple", icon: "🍎"}] },
      "Y": { target: [{word: "Yo-yo", icon: "🪀"}, {word: "Yacht", icon: "🛥️"}, {word: "Yak", icon: "🐂"}], distractors: [{word: "Zebra", icon: "🦓"}, {word: "Apple", icon: "🍎"}, {word: "Ball", icon: "⚽"}] },
      "Z": { target: [{word: "Zebra", icon: "🦓"}, {word: "Zoo", icon: "🦒"}, {word: "Zip", icon: "🤐"}], distractors: [{word: "Apple", icon: "🍎"}, {word: "Ball", icon: "⚽"}, {word: "Cat", icon: "🐱"}] }
    };

    const allLetters = Object.keys(alphabetData);
    let currentTargetLetter = "A";
    let correctFound = 0;
    let totalCorrect = 0;

    const targetLetterSpan = document.getElementById('target-letter');
    const roomContainer = document.getElementById('room-container');
    const statusText = document.getElementById('status-text');
    const modal = document.getElementById('completion-modal');
    const modalText = document.getElementById('modal-text');
    const alphabetGrid = document.getElementById('alphabet-grid');

    function initGrid() {
      alphabetGrid.innerHTML = '';
      allLetters.forEach(letter => {
        const btn = document.createElement('button');
        btn.className = `btn-letter ${letter === currentTargetLetter ? 'active' : ''}`;
        btn.innerText = letter;
        btn.setAttribute('data-letter', letter);
        btn.addEventListener('click', () => loadLevel(letter));
        alphabetGrid.appendChild(btn);
      });
    }

    function speak(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const msg = new SpeechSynthesisUtterance(text);
        msg.lang = 'en-US';
        window.speechSynthesis.speak(msg);
      }
    }

    function loadLevel(letter) {
      currentTargetLetter = letter;
      correctFound = 0;
      modal.style.display = 'none';
      statusText.innerText = '';
      targetLetterSpan.innerText = letter;

      document.querySelectorAll('.btn-letter').forEach(btn => {
        if (btn.getAttribute('data-letter') === letter) {
          btn.classList.add('active');
        } else {
          btn.classList.remove('active');
        }
      });

      const data = alphabetData[letter] || { target: [{word: letter, icon: "🔤"}], distractors: [{word: "Apple", icon: "🍎"}] };
      
      let cardsList = [];
      data.target.forEach(item => {
        cardsList.push({ letter: letter, word: item.word, icon: item.icon, audio: `${letter}... for ${item.word}!` });
      });
      totalCorrect = cardsList.length;

      let distractorPool = [...data.distractors];
      distractorPool.sort(() => Math.random() - 0.5);
      
      while (cardsList.length < 6 && distractorPool.length > 0) {
        let d = distractorPool.pop();
        cardsList.push({ letter: "other", word: d.word, icon: d.icon, audio: `This word starts with a different letter!` });
      }

      cardsList.sort(() => Math.random() - 0.5);

      roomContainer.innerHTML = '';
      cardsList.forEach(item => {
        const card = document.createElement('div');
        card.className = 'item-card';
        card.setAttribute('data-letter', item.letter);
        card.setAttribute('data-word', item.word);
        card.setAttribute('data-audio', item.audio);

        card.innerHTML = `
          <div class="item-icon">${item.icon}</div>
          <div class="item-label">${item.word}</div>
        `;

        card.addEventListener('click', () => handleCardClick(card));
        roomContainer.appendChild(card);
      });

      speak(`Find the things that start with the letter ${letter}.`);
    }

    function handleCardClick(card) {
      if (card.classList.contains('correct')) return;

      const cardLetter = card.getAttribute('data-letter');
      const audioText = card.getAttribute('data-audio');

      if (cardLetter === currentTargetLetter) {
        card.classList.remove('wrong');
        card.classList.add('correct');
        statusText.innerText = audioText;
        
        playCorrectSound();
        speak(audioText);
        
        correctFound++;
        if (correctFound === totalCorrect) {
          setTimeout(() => {
            modalText.innerText = `You found all the words starting with the letter '${currentTargetLetter}'!`;
            modal.style.display = 'flex';
            speak("Excellent! You found all the correct words!");
          }, 1500);
        }
      } else {
        card.classList.add('wrong');
        setTimeout(() => card.classList.remove('wrong'), 400);
        const retryMsg = "Try again! This word starts with a different letter.";
        statusText.innerText = retryMsg;
        
        playWrongSound();
        speak(retryMsg);
      }
    }

    initGrid();
    loadLevel("A");
  </script>
</body>
</html>
